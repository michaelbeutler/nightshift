name: Feature request
description: Propose a new capability or improvement.
labels: [enhancement]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Asking for a new git host (Gitea/Forgejo, Bitbucket, Azure DevOps, …)?
        Use the **Provider request** template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that isn't possible or is awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? The command or config you would write, and what should happen at night.
    validations:
      required: true
  - type: textarea
    id: unattended
    attributes:
      label: What runs unattended?
      description: Would this change what nightshift does at night without you watching (what it commits, signs or pushes, which commands it runs, which credentials it uses)? "Nothing" is a fine answer.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Commit (queuing, adopting commits)
        - Push / pull requests
        - Scheduling (night window, spacing)
        - Runner (run, daemon, service)
        - Signing
        - Credentials / tokens
        - Configuration
        - MCP server
        - Notifications
        - CLI output / UX
        - Developer experience / docs
        - Other
    validations:
      required: true
